<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rock, Paper, Scissors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Rock, Paper, Scissors</h1>
    <p>Enter your name, click Start Game, then choose Rock, Paper, or Scissors.</p>
  </header>

  <!-- Player name input -->
  <section>
    <label for="playerName">Your name:</label>
    <input type="text" id="playerName">
    <button onclick="startGame()">Start Game</button>
    <p id="welcomeMsg"></p>
  </section>

  <!-- Choice buttons and images -->
  <section>
    <button onclick="playRound('rock')">Rock</button>
    <button onclick="playRound('paper')">Paper</button>
    <button onclick="playRound('scissors')">Scissors</button>

    <div class="arena">
      <div>
        <!-- Player choice image -->
        <p><strong>You</strong></p>
        <img id="playerImg" src="rock.png" alt="Player choice">
      </div>

      <p><strong>VS</strong></p>

      <div>
        <p><strong>Computer</strong></p>
        <img id="computerImg" src="rock.png" alt="Computer choice">
      </div>
    </div>
  </section>

  <!-- Result and score -->
  <section>
    <p id="result"></p>
    <p>
      Wins: <span id="wins">0</span>
      Losses: <span id="losses">0</span>
      Draws: <span id="draws">0</span>
    </p>
  </section>

  <!-- History table and summary/reset buttons -->
  <section>
    <h2>History</h2>
    <table id="history">
      <tr>
        <th>Round</th>
        <th>You</th>
        <th>Computer</th>
        <th>Result</th>
      </tr>
    </table>

    <br>
    <button onclick="showSummary()">Show Summary</button>
    <button onclick="resetGame()">Reset</button>
    <p id="summary"></p>
  </section>

  <footer>
    <p id="startTime"></p>
    <p>&copy; 2026 Computer Science Club</p>
  </footer>

  <script src="game.js"></script>
</body>
</html>
